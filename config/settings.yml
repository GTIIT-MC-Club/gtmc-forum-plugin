# 只列第一期用到的设置；gtmc_ip_trust_hours 等第二期的设置随对应任务加入。
discourse_gtmc:
  gtmc_enabled:
    default: true
    client: true
  gtmc_heartbeat_timeout_seconds:
    # MC 插件默认每 30 秒上报一次，90 秒相当于连续丢三次心跳才判定离线。
    # 下限取心跳间隔 30 秒：再小的话两次心跳之间就会闪成离线。
    default: 90
    min: 30
    max: 3600
  # 登记接入论坛的 MC 服，契约见 PLAN.md 4.1。前端不直接读这个设置，展示用的字段由 status.json 带出，
  # 所以不设 client: true。
  # schema 不支持正则，server_id 的格式和唯一性由 ServerRegistry 在读取时检查，见 README。
  # server_id 的 32 来自契约里的格式；其余长度上限只用来挡住误粘贴的大段文字，离真实值很远。
  gtmc_servers:
    type: objects
    default: []
    schema:
      name: server
      identifier: name
      properties:
        server_id:
          type: string
          required: true
          validations:
            max_length: 32
        name:
          type: string
          required: true
          validations:
            max_length: 50
        address:
          type: string
          required: true
          validations:
            max_length: 200
        map_url:
          type: string
          validations:
            max_length: 500
        # type: icon 在后台是图标选择器，gtmc-* 主题图标和 Font Awesome 图标都能选；
        # 选中的图标会自动进入站点的图标精灵，前端才画得出来。
        icon:
          type: icon
          required: true
        # schema 没有颜色类型，格式（#RRGGBB）由 ServerRegistry 在读取时检查。
        color:
          type: string
          validations:
            max_length: 7
  gtmc_rail_visible_servers:
    # 右栏「服务器」面板默认展开的服数量，其余折叠。社团现在有 4 个服，默认折叠最后 1 个，
    # 免得服务器面板把下面的「新人进服」挤出第一屏。前端要读，所以 client: true。
    # 上限 20 远超社团的服数量，只用来挡住误填。
    default: 3
    min: 1
    max: 20
    client: true
