# 只列第一期用到的设置；gtmc_ip_trust_hours 等第二期的设置随对应任务加入。
discourse_gtmc:
  gtmc_enabled:
    default: true
    client: true
  gtmc_heartbeat_timeout_seconds:
    # MC 插件默认每 30 秒上报一次，90 秒相当于连续丢三次心跳才判定离线。
    # 下限取心跳间隔 30 秒：再小的话两次心跳之间就会闪成离线。
    default: 90
    min: 30
    max: 3600
  # 登记接入论坛的 MC 服，说明见 README。前端不直接读这个设置，展示用的字段由 status.json 带出，
  # 所以不设 client: true。
  # schema 不支持正则，server_id 的格式和唯一性由 ServerRegistry 在读取时检查，见 README。
  # server_id 的 32 来自契约里的格式；其余长度上限只用来挡住误粘贴的大段文字，离真实值很远。
  gtmc_servers:
    type: objects
    default: []
    # label、description 是后台编辑器里显示的字段名和说明，编辑器原样显示，不走翻译。顺序就是编辑器里的顺序。
    # name 是左边树里「+ 服务器」「+ 地址」按钮上的字。
    schema:
      name: 服务器
      identifier: name
      properties:
        name:
          type: string
          required: true
          label: 名称
          description: 右栏上显示的名字，如「生存服」。
          validations:
            max_length: 50
        server_id:
          type: string
          required: true
          label: 编号
          description: 1–32 个小写字母、数字或连字符，如 survival，各服不能重复。装了心跳插件的服，要和插件配置里的 server_id 一致。
          validations:
            max_length: 32
        # type: icon 在后台是图标选择器，gtmc-* 主题图标和 Font Awesome 图标都能选；
        # 选中的图标会自动进入站点的图标精灵，前端才画得出来。
        icon:
          type: icon
          required: true
          label: 备用图标
          description: 服务器自己没设图标（server-icon.png）时显示这个。设了的话论坛会自动取来显示。
        # 格式由 ServerRegistry 检查。
        query_address:
          type: string
          label: 查询地址
          description: 论坛查询这个服用的 IP:Query端口（局域网地址），如 192.168.2.103:25565。服务器要开 enable-query。留空就不查询，只能靠心跳插件上报。不对外显示。
          validations:
            max_length: 260
        map_url:
          type: string
          label: 地图网址
          description: 网页地图（BlueMap、Dynmap、squaremap 等）的网址，填了右栏会多一个地图按钮。没有就留空。
          validations:
            max_length: 500
        # schema 没有颜色类型，格式（#RRGGBB）由 ServerRegistry 在读取时检查。
        color:
          type: string
          label: 颜色
          description: 备用图标的颜色，#RRGGBB，如 #5DBB47。留空用主题色。
          validations:
            max_length: 7
        # 玩家连接用的地址，在左边树里这个服下面点「+ 地址」添加，至少一个（ServerRegistry 检查）。
        # 只有一个时右栏的复制按钮直接复制，多个时弹出菜单选。
        addresses:
          type: objects
          schema:
            name: 地址
            identifier: label
            properties:
              label:
                type: string
                label: 标签
                description: 如「外网」「内网」。只有一个地址时可以不填。
                validations:
                  max_length: 20
              address:
                type: string
                required: true
                label: 地址
                description: 玩家连接用的地址，如 frp-xxx.com:12345 或 10.202.28.100:25565。排第一的是主地址。
                validations:
                  max_length: 200
  gtmc_rail_visible_servers:
    # 右栏「服务器」面板默认展开的服数量，其余折叠。社团现在有 4 个服，默认折叠最后 1 个，
    # 免得服务器面板把下面的「新人进服」挤出第一屏。前端要读，所以 client: true。
    # 上限 20 远超社团的服数量，只用来挡住误填。
    default: 3
    min: 1
    max: 20
    client: true
  gtmc_player_avatar_url:
    # 右栏在线玩家的头像（皮肤的脸）从哪取。{name} 换成游戏名，{size} 换成像素尺寸。
    # 取不到（没在皮肤站建角色）时前端回退成字母头像；留空则一律用字母头像。
    # 前端不直接读：后端把 {name} 换好后放进 status.json，所以不设 client: true。
    default: "https://skin.gtmc.top/avatar/player/{name}?size={size}"
    validations:
      max_length: 500
  gtmc_announcement_category:
    # 右栏「公告」面板读哪个版块。由 infra/discourse/sidebar.rb 按名字「公告」找到版块后写入；
    # 为空时面板不出现。前端要读，所以 client: true。
    type: category
    default: ""
    client: true
