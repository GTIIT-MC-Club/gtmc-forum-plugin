en:
  site_settings:
    gtmc_enabled: "Enable the GTMC plugin (Minecraft server status, account binding)."
    gtmc_heartbeat_timeout_seconds: "Mark a Minecraft server as offline when no heartbeat has arrived from it for this many seconds."
    gtmc_servers: "Minecraft servers shown on the forum. Each entry needs a server_id (1–32 lowercase letters, digits or hyphens, unique, identical to server_id in that server's plugin config), a name and an address (both shown to users) and an icon (pick a gtmc-* icon from the theme, or a Font Awesome icon). color (#RRGGBB, optional) tints the icon; leave it empty for the theme accent color. map_url is optional; the map link is only shown when it starts with http:// or https://. Entries that break these rules are ignored, and a warning is logged when you save. Display order does not matter: servers that are online and busiest are listed first, the rest keep the order set here."
    gtmc_rail_visible_servers: "How many servers the right-hand 'Servers' panel shows before folding the rest behind a '+N' button."
