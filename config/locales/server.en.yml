en:
  site_settings:
    gtmc_enabled: "Enable the GTMC plugin (Minecraft server status, newcomer progress)."
    gtmc_heartbeat_timeout_seconds: "Mark a Minecraft server as offline when no heartbeat has arrived from it for this many seconds."
    gtmc_servers: "Minecraft servers shown on the forum. Open the editor, add a server with \"+ 服务器\", then add the addresses players connect to (LAN, public, ...) with \"+ 地址\" under it. Each field is explained under it. Invalid entries are ignored and a warning is logged when you save. See \"登记 MC 服\" in the plugin README."
    gtmc_rail_visible_servers: "How many servers the right-hand 'Servers' panel shows before folding the rest behind a '+N' button."
    gtmc_player_avatar_url: "Where online players' avatars (their skin's face) come from. {name} is the player name, {size} the size in pixels. Players without a skin there get a letter avatar; leave empty to always use letter avatars."
    gtmc_announcement_category: "The category whose latest topics appear in the right rail announcements panel. Leave empty to hide the panel."
    gtmc_skin_api_url: "The skin site endpoint that lists a user's characters by email, used by steps 2 and 3 of the newcomer panel. See the gtmc-casdoor plugin in gtmc-auth-core."
    gtmc_skin_api_key: "Key for the skin site endpoint above; the same value as SKIN_FORUM_API_KEY in the skin site's .env. Leave empty to skip the lookup, which leaves steps 2 and 3 undone."
    gtmc_newcomer_character_url: "Where the newcomer panel's 'create a character' step links to."
    gtmc_newcomer_join_guide_url: "Where the newcomer panel's 'join a server' step links to: launcher setup and server addresses."
    gtmc_skin_site_url: "The skin site, where the 'My characters' panel gets skins from. Leave empty to hide the panel."
    gtmc_wiki_links: "Links in the right rail's Wiki panel, in order. Clear to hide the panel."
