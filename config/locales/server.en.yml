en:
  site_settings:
    gtmc_enabled: "Enable the GTMC plugin (Minecraft server status, account binding)."
    gtmc_heartbeat_timeout_seconds: "Mark a Minecraft server as offline when no heartbeat has arrived from it for this many seconds."
    gtmc_servers: "Minecraft servers shown on the forum. Open the editor, add a server with \"+ 服务器\", then add the addresses players connect to (LAN, public, ...) with \"+ 地址\" under it. Each field is explained under it. Invalid entries are ignored and a warning is logged when you save. See \"登记 MC 服\" in the plugin README."
    gtmc_rail_visible_servers: "How many servers the right-hand 'Servers' panel shows before folding the rest behind a '+N' button."
    gtmc_announcement_category: "The category whose latest topics appear in the right rail announcements panel. Leave empty to hide the panel."
